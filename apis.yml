name: Snaproute
description: >-
  SnapRoute was a cloud-native networking startup, backed by Lightspeed Venture
  Partners and Norwest Venture Partners, that built a containerized, microservices-based
  network operating system (its FlexSwitch / Cloud-Native Network OS) aimed at running
  switch software with the same DevOps tooling used for application infrastructure.
  Its public GitHub organization (github.com/snaproute) reflects that focus — OpenConfig
  and YANG tooling (pyang/pyangbind), OpenNetworkLinux, netlink, sFlow, and a Docker-based
  training lab — but it has been dormant since 2020 and ships no published REST/OpenAPI
  interface, SDKs, or developer portal. The company no longer operates independently:
  the snaproute.com domain now 301-redirects to infoblox.com, so there is no live API
  surface to enrich. This profile records the verifiable remnants (GitHub organization,
  domain posture) rather than a working developer program.
